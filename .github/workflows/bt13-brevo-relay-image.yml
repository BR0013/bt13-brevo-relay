name: Build BT13 Brevo relay image

on:
  push:
    branches: [main]
    paths:
      - 'services/bt13-brevo-relay/**'
      - '.github/workflows/bt13-brevo-relay-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish relay image
        uses: docker/build-push-action@v6
        with:
          context: services/bt13-brevo-relay
          file: services/bt13-brevo-relay/Dockerfile
          push: true
          tags: ghcr.io/br0013/bt13-brevo-relay:latest

      - name: Set GHCR package visibility for Render Free
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body --request PUT \
            --url https://api.github.com/user/packages/container/bt13-brevo-relay/visibility \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"visibility":"public"}' \
            --output /dev/null
